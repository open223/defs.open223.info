name: Build index.html

# The only committed input is ontologies/223p.ttl, copied from a 223standard
# publication build by 'make sync'. Everything the site serves is generated
# from it here, so a push of that one file republishes the site and, when the
# page changed, publishes it as a release.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install        # the version in .python-version

      - name: Build the site
        run: make

      - name: Run the stable-ID tests
        run: make test

      # Catches ontologies/223p.ttl coming from a graph other than the one the
      # publication minted its links from, which builds cleanly but anchors
      # nothing the document points at.
      - name: Check the publication's anchors resolve
        run: make check-anchors

      - name: Assemble the site
        run: make dist

      # Downloadable from the run's summary page: index.html plus the
      # ontologies it serves, for copying to any other host.
      - name: Upload index.html as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          if-no-files-found: error

      - name: Upload the GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # Publishes to defs.open223.info. Requires the repository's Pages source to
  # be set to "GitHub Actions" rather than a branch.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    # One deployment at a time, and never cancel one midway. Scoped to this
    # job so pull request builds don't queue behind, or cancel, a deploy.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from this workflow

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Attaches what was just deployed to a GitHub Release, so the newest build is
  # always at /releases/latest/download/index.html. Runs after the deploy so
  # the latest release is always what defs.open223.info serves.
  release:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to create the release and its tag

    steps:
      - name: Download the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - name: Publish a release if the site changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Rebuilding unchanged inputs reproduces index.html byte for byte, so
          # a push that doesn't change the page (docs, CI) publishes nothing.
          if gh release download --pattern index.html --dir previous 2>/dev/null &&
              cmp -s previous/index.html site/index.html; then
            echo "index.html matches the latest release; nothing to publish"
            exit 0
          fi

          version="$(sed -n 's:.*<code id="ontology-version">\([^<]*\)</code>.*:\1:p' site/index.html)"
          concepts="$(grep -c '<article class="card"' site/index.html)"
          tag="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"

          # e.g. "git:master@6fdc11c6... date:..." -> "master@6fdc11c"
          upstream="$(sed 's/^git:\([^@ ]*\)@\([0-9a-f]\{7\}\).*/\1@\2/' <<<"$version")"

          (cd site && zip -qr ../site.zip .)

          gh release create "$tag" site/index.html site.zip \
              --target "$GITHUB_SHA" \
              --title "$tag (223standard $upstream)" \
              --notes "Built from 223standard \`$version\`: $concepts definitions.

          \`index.html\` is the whole site and works unchanged at any host. \`site.zip\` adds the \`ontologies/\` directory it also serves.

          Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
